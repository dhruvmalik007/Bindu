apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bindu-dashboard.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
