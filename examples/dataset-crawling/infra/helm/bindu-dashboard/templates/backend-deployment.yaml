apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bindu-dashboard.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bindu-dashboard.name" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
